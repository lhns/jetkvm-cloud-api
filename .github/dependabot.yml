# Base images and actions only; app dependencies arrive through upstream merges.
# Merged by hand: lhns-build is deployed from the image these produce.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # package.json requires engines 22.x.
      - dependency-name: "node"
        versions: [">=23"]
    groups:
      base-images:
        patterns: ["*"]
