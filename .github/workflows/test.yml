name: CI

on:
  push:
  workflow_dispatch:

# Runs on lhns-build queue instead of cancelling, so the image tag moves in commit order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/lhns-build' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  DATABASE_URL: postgresql://jetkvm:jetkvm@localhost:5432/jetkvm?schema=public

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jetkvm
          POSTGRES_PASSWORD: jetkvm
          POSTGRES_DB: jetkvm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jetkvm -d jetkvm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npx prisma migrate deploy
      # The migrations must produce exactly the schema: a hand-written one that drifts fails here.
      - run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      PUBLISH: ${{ github.ref == 'refs/heads/lhns-build' }}
    # Service containers are per job; the test job's database is not available here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jetkvm
          POSTGRES_PASSWORD: jetkvm
          POSTGRES_DB: jetkvm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jetkvm -d jetkvm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Anonymous pulls of the base images share the runner IP's quota and get 429s. Without
      # both secrets the build pulls anonymously.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
          flavor: latest=false

      # Built and tested first; the pushed build below reuses its layers from the cache.
      - name: Build (loaded, for the smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: smoke:local
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails without libssl: Prisma then warns and dies with "Schema engine error".
      - name: Smoke test, migrate against Postgres
        run: |
          set -o pipefail
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" smoke:local npm run prisma-migrate 2>&1 | tee migrate.log
          if grep -qiE 'libssl|failed to detect|schema engine error' migrate.log; then echo 'openssl problem'; exit 1; fi
          grep -q 'successfully applied' migrate.log

      - name: Hash the image files
        run: docker run --rm --entrypoint sh smoke:local -c 'find dist prisma -type f | sort | xargs sha256sum' > loaded.sha

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify the published image
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker pull "$IMAGE_NAME@$DIGEST"
          docker run --rm --entrypoint sh "$IMAGE_NAME@$DIGEST" -c 'find dist prisma -type f | sort | xargs sha256sum' > published.sha
          diff loaded.sha published.sha
          {
            echo "### Published image"
            echo
            echo "\`$IMAGE_NAME:lhns-build@$DIGEST\` from commit \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
